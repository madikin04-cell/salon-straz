<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Салон Красоты «СТРАЗЫ» — MAX Mini-App</title>
    <!-- Библиотека Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top right, #fdf2f8, #f3e8ff, #f8fafc); min-height: 100vh; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .strass-gradient { background: linear-gradient(135deg, #581c87 0%, #9d174d 50%, #be185d 100%); }
        .rose-gold-badge { background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 100%); color: #831843; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes pulseGlow { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.15); opacity: 1; } }
        .sparkle-icon { animation: pulseGlow 2.5s infinite ease-in-out; }
    </style>
</head>
<body class="text-slate-800 pb-10">

    <!-- ВЕРХНИЙ ПЕРЕКЛЮЧАТЕЛЬ РЕЖИМОВ -->
    <div class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md text-white border-b border-slate-700 shadow-lg">
        <div class="max-w-4xl mx-auto px-3 py-2.5 flex flex-col sm:flex-row items-center justify-between gap-2">
            <div class="flex items-center gap-2 text-xs sm:text-sm font-medium text-pink-200">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Стенд: <strong>Бот «СТРАЗЫ» в MAX</strong></span>
            </div>
            <div class="flex bg-slate-800 p-1 rounded-xl border border-slate-700 w-full sm:w-auto">
                <button id="btnViewClient" onclick="switchMainView('client')" class="flex-1 sm:flex-initial px-3 py-1.5 rounded-lg text-xs font-semibold transition-all bg-pink-600 text-white shadow">
                    📱 Экран клиента
                </button>
                <button id="btnViewMaster" onclick="switchMainView('master')" class="flex-1 sm:flex-initial px-3 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-300 hover:text-white">
                    💇‍♀️ Вход мастера
                </button>
                <button id="btnViewAdmin" onclick="switchMainView('admin')" class="flex-1 sm:flex-initial px-3 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-300 hover:text-white relative">
                    ⚙️ Админ
                    <span id="adminBadgeCount" class="ml-1 px-1.5 py-0.2 text-[10px] bg-amber-400 text-slate-950 font-extrabold rounded-full hidden">0</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 1. ЭКРАН КЛИЕНТА                           -->
    <!-- ========================================== -->
    <div id="clientViewContainer" class="max-w-md mx-auto mt-4 sm:mt-6 px-2 sm:px-0">
        <div class="bg-white rounded-[2rem] shadow-2xl border-4 border-slate-800 overflow-hidden relative min-h-[760px] flex flex-col">
            <div class="bg-slate-900 text-white px-4 py-3 flex items-center justify-between border-b border-slate-800">
                <div class="flex items-center gap-2.5">
                    <button class="text-slate-400 hover:text-white text-sm flex items-center gap-1 bg-slate-800 px-2.5 py-1 rounded-lg">
                        <i class="fa-solid fa-comment-dots text-pink-400"></i><span class="text-xs font-medium">Чат MAX</span>
                    </button>
                    <div>
                        <div class="text-xs font-bold flex items-center gap-1">Салон СТРАЗЫ <i class="fa-solid fa-circle-check text-sky-400 text-[10px]"></i></div>
                        <div class="text-[10px] text-slate-400">WebApp</div>
                    </div>
                </div>
            </div>

            <div id="maxWebAppScreen" class="flex-1 flex flex-col bg-slate-50 overflow-y-auto">
                <div class="strass-gradient text-white p-5 relative overflow-hidden">
                    <div class="absolute -right-6 -top-6 w-28 h-28 rounded-full bg-white/10 blur-xl"></div>
                    <div class="absolute right-6 top-4 text-pink-200/70 text-xl sparkle-icon">✦</div>
                    <div class="flex items-start justify-between relative z-10">
                        <div>
                            <div class="inline-flex items-center gap-1.5 bg-white/15 backdrop-blur-sm px-2.5 py-0.5 rounded-full text-[11px] font-semibold text-pink-100 mb-2">
                                <i class="fa-regular fa-clock"></i> 08:00 – 21:00
                            </div>
                            <h1 class="text-2xl font-extrabold tracking-tight">САЛОН «СТРАЗЫ»</h1>
                        </div>
                    </div>
                    
                    <div id="clientActiveBookingBanner" class="hidden mt-4 bg-white/95 text-slate-800 rounded-xl p-2.5 shadow-md flex items-center justify-between">
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold"><i class="fa-solid fa-check"></i></div>
                            <div class="text-xs">
                                <div class="font-bold text-slate-900" id="bannerBookingTitle">Вы записаны!</div>
                                <div class="text-slate-500 text-[11px]" id="bannerBookingSub">Детали в чате</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white border-b border-slate-200 px-3 py-2.5 sticky top-0 z-20 shadow-xs">
                    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar" id="categoryTabs"></div>
                </div>
                <div class="bg-white border-b border-slate-100 px-4 py-3">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-[11px] font-bold uppercase text-slate-500">День записи:</span>
                        <span class="text-[11px] font-bold text-pink-700" id="clientSelectedDateTitle">Сегодня</span>
                    </div>
                    <div id="clientMainDateStrip" class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1"></div>
                </div>
                <div class="px-4 pt-3.5 pb-1">
                    <div class="flex items-center justify-between mb-2">
                        <h2 class="text-xs font-bold uppercase text-slate-400">Мастера</h2>
                    </div>
                    <div id="mastersHorizontalList" class="flex gap-2.5 overflow-x-auto no-scrollbar pb-2"></div>
                </div>
                <div class="p-4 space-y-3 flex-1" id="servicesListContainer"></div>
            </div>

            <!-- МОДАЛЬНОЕ ОКНО ЗАПИСИ -->
            <div id="bookingModal" class="hidden absolute inset-0 z-40 bg-slate-900/60 backdrop-blur-xs flex flex-col justify-end">
                <div class="bg-white rounded-t-3xl max-h-[92%] flex flex-col shadow-2xl animate-slide-up overflow-hidden">
                    <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between bg-gradient-to-r from-pink-50 to-purple-50">
                        <div>
                            <span class="text-[10px] font-bold text-pink-700" id="modalCategoryBadge">КАТЕГОРИЯ</span>
                            <h3 class="text-sm font-extrabold text-slate-900" id="modalServiceTitle">Услуга</h3>
                        </div>
                        <button onclick="closeBookingModal()" class="w-8 h-8 rounded-full bg-white text-slate-500 hover:bg-slate-100 flex items-center justify-center">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <div class="p-4 sm:p-5 overflow-y-auto space-y-4 flex-1">
                        <div>
                            <label class="text-xs font-bold text-slate-700 mb-2 block">1. Выберите время (08:00 – 21:00):</label>
                            <div id="modalTimeSlots" class="grid grid-cols-3 gap-2"></div>
                        </div>

                        <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200/80 space-y-2.5">
                            <label class="block text-xs font-bold text-slate-700">2. Ваши данные:</label>
                            <input type="text" id="clientNameInput" placeholder="Ваше имя" class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl">
                            <input type="tel" id="clientPhoneInput" placeholder="+7 (999) 000-00-00" value="+7" class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl">
                            <p id="bookingErrorMsg" class="hidden text-xs text-rose-600 font-semibold"></p>
                        </div>
                    </div>

                    <div class="p-4 border-t border-slate-100 bg-white flex items-center justify-between gap-3">
                        <div>
                            <div class="text-[11px] text-slate-400">К оплате:</div>
                            <div class="text-lg font-extrabold text-slate-900" id="modalTotalPrice">0 ₽</div>
                        </div>
                        <button id="btnSubmitBooking" onclick="submitBooking()" class="flex-1 py-3.5 px-5 rounded-xl strass-gradient text-white font-bold text-sm shadow-lg hover:opacity-95 transition">
                            Подтвердить
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================================== -->
    <!-- 2. ПАНЕЛЬ АДМИНИСТРАТОРА (С АВТОРИЗАЦИЕЙ)                  -->
    <!-- ========================================================== -->
    <div id="adminViewContainer" class="hidden max-w-4xl mx-auto mt-6 px-3 sm:px-6 space-y-6">
        
        <!-- ФОРМА ВХОДА АДМИНА -->
        <div id="adminLoginForm" class="bg-white rounded-3xl p-6 shadow-xl border border-slate-200 max-w-sm mx-auto mt-10">
            <div class="text-center mb-6">
                <div class="w-14 h-14 bg-slate-900 text-white rounded-2xl flex items-center justify-center mx-auto text-2xl mb-3 shadow-sm">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h2 class="text-xl font-extrabold text-slate-900">Вход для Админа</h2>
                <p class="text-xs text-slate-500 mt-1">Введите Email и пароль из Supabase</p>
            </div>
            <div class="space-y-4">
                <input type="email" id="adminEmail" placeholder="Email (admin@straz.ru)" class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl">
                <input type="password" id="adminPass" placeholder="Пароль" class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl">
                <p id="adminAuthError" class="hidden text-xs text-rose-600 font-semibold text-center"></p>
                <button type="button" onclick="adminLogin(this)" class="w-full py-3.5 rounded-xl bg-slate-900 text-white font-bold text-sm shadow-lg hover:bg-slate-800 transition">
                    Войти в панель
                </button>
            </div>
        </div>

        <!-- ОСНОВНОЙ КОНТЕНТ АДМИНКИ -->
        <div id="adminDashboardContent" class="hidden space-y-6">
            <div class="bg-white rounded-2xl p-5 shadow-md border border-slate-200 flex flex-col sm:flex-row justify-between gap-4">
                <div>
                    <h2 class="text-xl font-extrabold text-slate-900">Управление записями (Supabase)</h2>
                </div>
                <div class="flex gap-3 items-center">
                    <button onclick="adminLogout()" class="px-3 py-2 rounded-lg text-xs font-bold bg-slate-100 text-slate-600">Выход</button>
                </div>
            </div>

            <!-- Блок заявок из БД -->
            <div class="bg-white rounded-2xl p-5 shadow-md border border-slate-200">
                <div class="flex justify-between pb-4 border-b border-slate-100">
                    <h3 class="text-base font-extrabold text-slate-900">Заявки клиентов</h3>
                    <button onclick="fetchBook
